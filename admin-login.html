<!DOCTYPE html>
<html lang="it" style="background:#14100d;color:#f3ddae;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso Amministratore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14100d;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: #1d160f;
      border: 1px solid rgba(216,164,79,0.22);
      border-radius: 20px;
      padding: 44px 36px 40px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .eyebrow {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.4em;
      color: #d8a44f;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .rule {
      width: 48px;
      height: 1px;
      background: linear-gradient(to right, transparent, #d8a44f, transparent);
      opacity: 0.5;
      margin-bottom: 8px;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: #f3ddae;
      text-transform: uppercase;
      margin-bottom: 32px;
      text-align: center;
    }

    .error-msg {
      width: 100%;
      background: rgba(255,90,60,0.12);
      border: 1px solid rgba(255,90,60,0.35);
      color: #ff8a5b;
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      text-align: center;
      display: none;
    }
    .error-msg.visible { display: block; }

    label {
      width: 100%;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #9f7f55;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    input[type="password"] {
      width: 100%;
      background: #16120f;
      border: 1px solid #4b3927;
      border-radius: 10px;
      color: #f3ddae;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 24px;
      -webkit-text-security: disc;
    }
    input[type="password"]:focus { border-color: rgba(216,164,79,0.55); }

    button[type="submit"] {
      width: 100%;
      background: linear-gradient(135deg, #d8a44f 0%, #c08a3a 100%);
      color: #14100d;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      border: none;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button[type="submit"]:hover { opacity: 0.88; }
    button[type="submit"]:active { opacity: 0.75; }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Area Riservata</div>
    <div class="rule"></div>
    <div class="title">Amministratore</div>

    <div class="error-msg" id="err">Password non corretta</div>

    <form method="POST" action="/api/login" style="width:100%">
      <label for="pwd">Password</label>
      <input type="password" id="pwd" name="password" autocomplete="current-password" autofocus required>
      <button type="submit">Accedi</button>
    </form>
  </div>

  <script>
    if (location.search.includes('error=1')) {
      document.getElementById('err').classList.add('visible');
    }
  </script>
</body>
</html>
